<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Explore Trails</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      placeholder="Search all trails..."
      [debounce]="150"
      (ionInput)="onSearch($event)"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page-pad">
    <ion-segment [value]="difficultyFilter()" (ionChange)="onSegmentChange($event)" class="difficulty-seg">
      <ion-segment-button value="All"><ion-label>All</ion-label></ion-segment-button>
      <ion-segment-button value="Easy"><ion-label>Easy</ion-label></ion-segment-button>
      <ion-segment-button value="Moderate"><ion-label>Moderate</ion-label></ion-segment-button>
      <ion-segment-button value="Hard"><ion-label>Hard</ion-label></ion-segment-button>
    </ion-segment>

    <p class="result-count">{{ results().length }} trail{{ results().length !== 1 ? 's' : '' }} found</p>

    <app-trail-card
      *ngFor="let trail of results()"
      [trail]="trail"
      (details)="openTrail($event)"
      (cardTap)="openTrail($event)"
    ></app-trail-card>

    <div class="bottom-spacer"></div>
  </div>
</ion-content>
