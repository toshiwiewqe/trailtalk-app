<div class="trail-card" (click)="onTap()">
  <div class="trail-image" [style.backgroundImage]="'url(' + trail.image + ')'">
    <!-- Hidden while the rating is 0. The 30-trail dataset ships with no
         review scores, and "★ 0" reads as a bad rating rather than an
         absent one. -->
    <div class="rating-chip" *ngIf="trail.rating > 0">
      <ion-icon name="star"></ion-icon>
      <span>{{ trail.rating }}</span>
    </div>
  </div>
  <div class="trail-body">
    <h3>{{ trail.name }}</h3>
    <p class="region">
      <ion-icon name="location-outline"></ion-icon>
      {{ trail.region }}
    </p>
    <div class="trail-meta">
      <span class="difficulty" [ngClass]="trail.difficulty.toLowerCase()">{{ trail.difficulty }}</span>
      <span class="dot">&bull;</span>
      <span>{{ trail.distance }}</span>
    </div>
    <div class="trail-footer">
      <span class="elevation">{{ trail.elevation }} elev.</span>
      <ion-button size="small" class="details-btn" (click)="onDetails($event)">DETAILS</ion-button>
    </div>
  </div>
</div>
